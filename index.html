<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiGle Ghost Scanner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        #scanner-ui {
            border: 1px solid #00ff41;
            width: 90%;
            max-width: 500px;
            min-height: 300px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            background: rgba(0, 20, 0, 0.9);
        }
        .network-item {
            border-bottom: 1px dotted #003b00;
            padding: 10px 0;
            font-size: 0.85em;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glitch { text-shadow: 2px 2px #ff00ff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        button {
            background: #003b00;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 12px 24px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            font-weight: bold;
        }
        input {
            background: #000;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px;
            width: calc(100% - 18px);
            margin-bottom: 10px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1 class="glitch">GHOST SCANNER v1.1</h1>

    <div id="setup-ui">
        <p>API HITELLESÍTÉS SZÜKSÉGES:</p>
        <input type="text" id="api_user" placeholder="WiGle API Name (AID...)">
        <input type="password" id="api_key" placeholder="WiGle API Token">
        <button onclick="saveCredentials()">MENTÉS ÉS INDÍTÁS</button>
    </div>

    <div id="scanner-ui" class="hidden">
        <button onclick="startScan()">SZKENNELÉS INDÍTÁSA</button>
        <div id="status">Rendszer kész.</div>
        <hr style="border: 0.5px solid #003b00;">
        <div id="results"></div>
    </div>

<script>
    // Service Worker regisztráció a PWA-hoz
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    function saveCredentials() {
        const user = document.getElementById('api_user').value;
        const key = document.getElementById('api_key').value;
        if(user && key) {
            localStorage.setItem('wigle_user', user);
            localStorage.setItem('wigle_key', key);
            checkAuth();
        }
    }

    function checkAuth() {
        if(localStorage.getItem('wigle_user')) {
            document.getElementById('setup-ui').classList.add('hidden');
            document.getElementById('scanner-ui').classList.remove('hidden');
        }
    }
    checkAuth();

    async function startScan() {
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const user = localStorage.getItem('wigle_user');
        const key = localStorage.getItem('wigle_key');

        status.innerText = "GPS JEL KERESÉSE...";
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            status.innerText = `LOC: ${lat.toFixed(4)}, ${lon.toFixed(4)} | ADATOK LEKÉRÉSE...`;

            try {
                // WiGle API lekérdezés szűkített tartományban
                const range = 0.002; 
                const url = `https://api.wigle.net/api/v2/network/search?latrange1=${lat-range}&latrange2=${lat+range}&longrange1=${lon-range}&longrange2=${lon+range}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': 'Basic ' + btoa(user + ':' + key),
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (data.success && data.results) {
                    results.innerHTML = "";
                    data.results.forEach(net => {
                        const div = document.createElement('div');
                        div.className = 'network-item';
                        div.innerHTML = `
                            [${net.trilat ? 'FIX' : 'LOST'}] <strong>${net.ssid || 'NULL_ID'}</strong><br>
                            BSSID: ${net.netid} | CH: ${net.channel}<br>
                            SEC: ${net.encryption.toUpperCase()}
                        `;
                        results.appendChild(div);
                    });
                    status.innerText = `TALÁLATOK: ${data.results.length} CSOMÓPONT`;
                } else {
                    status.innerText = "HIBA: " + (data.message || "Ismeretlen hiba");
                }
            } catch (err) {
                status.innerText = "HÁLÓZATI HIBA (CORS blokkolás?)";
                console.error(err);
            }
        }, (err) => {
            status.innerText = "GPS HIBA: Engedélyezd a helymeghatározást!";
        });
    }
</script>
</body>
</html>
